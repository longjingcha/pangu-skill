[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pangu-skill"
version = "0.1.0"
description = "An AI skill distillation platform for turning raw materials into structured skills"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
pangu-skill = "pangu_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
